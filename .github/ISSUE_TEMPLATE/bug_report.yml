name: Bug report
description: Report a reproducible problem with the Windows-native scripts
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the script/command and relevant non-secret environment details.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, GPU/CUDA details, and relevant component versions. Do not include tokens or private data.
