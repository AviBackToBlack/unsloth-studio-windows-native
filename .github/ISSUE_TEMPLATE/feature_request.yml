name: Feature request
description: Suggest an improvement to the Windows-native tooling
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution and any CUDA/runtime/isolation implications.
    validations:
      required: true
